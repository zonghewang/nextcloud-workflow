name: Linux Appimage Package
on:
  push:
    paths:
      - '.github/workflows/linux-appimage.yml'
  workflow_call:
  workflow_dispatch:
    inputs: 
      version_suffix: 
        description: 'Version suffix for the AppImage'        
        required: true        
        default: '33.0.0.0'

jobs:
  build:
    name: Linux Appimage Package
    runs-on: ubuntu-latest
    container:  ghcr.io/nextcloud/continuous-integration-client-appimage-qt6:client-appimage-el8-6.10.1-1
    env:
      BASE_WORKSPACE: ${{ github.workspace }}/nextcloud-desktop
      BASE_DEPLOY_DIR: ${{ github.workspace }}/nextcloud-desktop/deploy
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: zonghewang/nextcloud-desktop
          token: ${{ secrets.NEXTCLOUD_BRANCH_ACCESS_TOKEN }}
          path: nextcloud-desktop


      - name: Configure, compile and package
        id: build-appimage
        env:
          PR_ID: ${{ github.event.number }}
        run: |
            cd nextcloud-desktop
            BUILDNR=${GITHUB_RUN_ID} VERSION_SUFFIX=${{ github.event.inputs.version_suffix }} DRONE_COMMIT="" BUILD_UPDATER=ON DESKTOP_CLIENT_ROOT=`pwd` EXECUTABLE_NAME=nextcloud QT_BASE_DIR=/root/linux-gcc-x86_64 /bin/bash -c "./admin/linux/build-appimage.sh"
            mkdir -p deploy/
            cp -v *.AppImage deploy/
      
      - name: Upload AppImage artifact
        id: upload-appimage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nextcloud-appimage
          path: ${{ env.BASE_DEPLOY_DIR }}/${{ steps.build-appimage.outputs.APPIMAGE_NAME }}
          overwrite: true
          compression-level: 0 # squashfs is already compressed

      - name: Upload artifact to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET_NAME }}
          source-dir: 'nextcloud-desktop/deploy/'
          destination-dir: 'nextcloud-disktop/linux/'
          keep-file-fresh: true


