name: Windows Compile
on:
  workflow_dispatch:

jobs:
  build:
    name: Windows Compile
    runs-on: windows-2022
    env:
      BASE_WORKSPACE: ${{ github.workspace }}/nextcloud-desktop
      CRAFT_TARGET: windows-msvc2022_64-cl
      CHOCO_LOCATION: ${{ github.workspace }}/nextcloud-desktop/choco
      COBERTURA_COVERAGE_FILE:  ${{ github.workspace }}/nextcloud-desktop/cobertura_coverage/coverage.xml
      CRAFT_MASTER_LOCATION:  ${{ github.workspace }}/nextcloud-desktop/CraftMaster
      CRAFT_MASTER_CONFIG:  ${{ github.workspace }}/nextcloud-desktop/craftmaster.ini
      ARCHIVE_VERABLE: -zcvf
      ARCHIVE_PERFIX: .zip
      PYTHON_VERSION: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: zonghewang/nextcloud-desktop
          token: ${{ secrets.NEXTCLOUD_BRANCH_ACCESS_TOKEN }}
          path: nextcloud-desktop

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve Craft dependency revisions
        id: craft-revisions
        shell: pwsh
        run: |
          function configValue($key) {
              $escapedKey = [regex]::Escape($key)
              $matches = @(Select-String -Path "${{ env.CRAFT_MASTER_CONFIG }}" -Pattern "^\s*$escapedKey\s*=\s*(.+?)\s*$")
              if($matches.Count -ne 1) {
                  throw "Expected exactly one $key value in craftmaster.ini."
              }
              return $matches[0].Matches[0].Groups[1].Value.Trim()
          }

          $craftRevision = configValue "CraftRevision"
          $kdeBlueprintRef = configValue "craft/craft-blueprints-kde.revision"
          $nextcloudBlueprintRef = configValue "craft/craft-blueprints-nextcloud.revision"

          function remoteRevision($repository, $ref) {
              $revision = git ls-remote $repository $ref
              if($LASTEXITCODE -ne 0 -or !$revision) {
                  throw "Could not resolve $ref from $repository."
              }
              return ($revision -split '\s+')[0]
          }

          $kdeBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-kde.git" "refs/heads/$kdeBlueprintRef"
          $nextcloudBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-nextcloud.git" "refs/heads/$nextcloudBlueprintRef"
          @(
              "kde_ref=$kdeBlueprintRef"
              "nextcloud_ref=$nextcloudBlueprintRef"
              "key=$craftRevision-$kdeBlueprintRevision-$nextcloudBlueprintRevision"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append



      - name: Install Craft Master with Nextcloud Client Deps
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://github.com/KDE/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"
          
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|${{ steps.craft-revisions.outputs.kde_ref }}|"
          craft --add-blueprint-repository "https://oauth2:${{ secrets.NEXTCLOUD_BRANCH_ACCESS_TOKEN }}@github.com/zonghewang/nextcloud-desktop-client-blueprints.git|${{ steps.craft-revisions.outputs.nextcloud_ref }}|"
          craft craft
          craft --install-deps nextcloud-client

      #- name: Cache Install inkscape
      #  id: cache-install-inkscape
      #  uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #  with:
      #    path: C:\Program Files\inkscape
      #    key: ${{ runner.os }}-cache-install-inkscape

      - name: Install inkscape
        shell: pwsh
        run: |
          choco install inkscape

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
   
      - name: Compile
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          
          craft --options nextcloud-client.srcDir=${{ env.BASE_WORKSPACE }} nextcloud-client
          


      - name: Package
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          
          craft --options nextcloud-client.srcDir=${{ env.BASE_WORKSPACE }} --package nextcloud-client

      # - uses: shaowenchen/debugger-action@v2
      #   name: debugger
      #   timeout-minutes: 30
      #   continue-on-error: true
      #   with:
      #     frp_server_addr: ${{ secrets.FRP_SERVER_ADDR }}
      #     frp_server_port: ${{ secrets.FRP_SERVER_PORT }}
      #     frp_token: ${{ secrets.FRP_TOKEN }}
      #     ssh_port: ${{ secrets.SSH_PORT }}

      # https://github.com/microsoft/msix-packaging.git

      - name: build msi
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -SkipAutomaticLocation
          # tree /a /f   ${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/nextcloud-client/
          cd ${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp
          7z x nextcloud-client-master-master-windows-cl-msvc2022-x86_64.7z -ooutput
          Copy-Item -Path "${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp/output/i18n" -Destination "${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp/output/bin/" -Recurse
          # Copy-Item -Path "${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/build/nextcloud-client/work/build/src/gui/Nextcloud.ico" -Destination "${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp/output/bin/" -Recurse
          Copy-Item -Path "${{ env.BASE_WORKSPACE }}/admin/win/nsi/installer.ico" -Destination "${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp/output/bin/Nextcloud.ico" -Recurse
          cd ${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp/output/msi
          # $Env:WIX="C:\Program Files\WiX Toolset v6.0\bin\"
          & ./make-msi.bat ../bin
          mkdir ${{ env.BASE_WORKSPACE }}/output
          Copy-Item -Path "${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp/output/msi/*.msi" -Destination "${{ env.BASE_WORKSPACE }}/output/" -Recurse


 
      # - name: tar msi build script
      #   shell: pwsh
      #   run: |
      #     Compress-Archive -Path "${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp" -DestinationPath "${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}${{ env.ARCHIVE_PERFIX }}"

      - name: Upload msi
        uses: actions/upload-artifact@v4.6.2
        with:
          compression-level: 9
          name: msi-file
          path: |
            ${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp/output/msi/*.msi

      - name: Upload artifact to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET_NAME }}
          source-dir: '${{ env.BASE_WORKSPACE }}/output/'
          destination-dir: 'nextcloud-disktop/windows/'
          keep-file-fresh: true

      - name: Upload 7z
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-7z
          compression-level: 9
          path: |
            ${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}/tmp/*.7z
