name: Windows Build
on:
  workflow_call:
    inputs: 
      rebuild_cache: 
        description: 'Whether to rebuild the cache'        
        required: true        
        default: false
        type: boolean
    secrets:
      NEXTCLOUD_BRANCH_ACCESS_TOKEN:
        required: true
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET_NAME:
        required: true

jobs:
  build:
    name: Windows Build
    runs-on: windows-2022
    permissions: 
      contents: read
    env:
      BASE_WORKSPACE: ${{ github.workspace }}/nextcloud-desktop
      CRAFT_TARGET: windows-msvc2022_64-cl
      CHOCO_LOCATION: ${{ github.workspace }}/nextcloud-desktop/choco
      COBERTURA_COVERAGE_FILE:  ${{ github.workspace }}/nextcloud-desktop/cobertura_coverage/coverage.xml
      CRAFT_MASTER_LOCATION:  ${{ github.workspace }}/nextcloud-desktop/CraftMaster
      CRAFT_MASTER_CONFIG:  ${{ github.workspace }}/nextcloud-desktop/craftmaster.ini
      ARCHIVE_VERABLE: -zcvf
      ARCHIVE_PERFIX: .zip
    outputs:
      output1: ${{ steps.windows-cache-check.outputs.env-cache-hit }}
      output2: ${{ steps.windows-cache-check.outputs.build-cache-hit }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Checkout  repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: zonghewang/nextcloud-desktop
          token: ${{ secrets.NEXTCLOUD_BRANCH_ACCESS_TOKEN }}
          path: nextcloud-desktop

      - name: Check Cache
        id: windows-cache-check
        env:
          GH_TOKEN: ${{ secrets.NEXTCLOUD_BRANCH_ACCESS_TOKEN }}
          ENV_CACHE_KEY: ${{ runner.os }}-cache-${{ hashFiles(env.CRAFT_MASTER_CONFIG) }}
          BUILD_CACHE_KEY: ${{ runner.os }}-build-${{ hashFiles(env.CRAFT_MASTER_CONFIG) }}
        run: |
          function check_caches() {
            echo "init"
            $cacheKeysForPR=$(gh cache list --key ${{ env.ENV_CACHE_KEY }} --json key --jq '.[].key')
            echo $cacheKeysForPR
            echo "env-cache-hit=false" >> "$GITHUB_OUTPUT"
            foreach ($cacheKey in $cacheKeysForPR) {
                if ($cacheKey -ceq "${{ env.ENV_CACHE_KEY }}")  {
                  echo "hint env cache $cacheKey"
                  echo "env-cache-hit=true" >> "$GITHUB_OUTPUT"
                }
             }

            $cacheKeysForPR=$(gh cache list --key ${{ env.BUILD_CACHE_KEY }} --json key --jq '.[].key')
            echo $cacheKeysForPR
            echo "build-cache-hit=false" >> "$GITHUB_OUTPUT"
            foreach ($cacheKey in $cacheKeysForPR) {
                if ($cacheKey -ceq "${{ env.BUILD_CACHE_KEY }}")  {
                  echo "hint build cache $cacheKey"
                  echo "build-cache-hit=true" >> "$GITHUB_OUTPUT"
                }
             }
            echo "Done"
          }
          check_caches

      - name: Cleanup
        id: windows-build-cleanup
        if: inputs.rebuild_cache == true
        run: |
          function clearn_caches() {
            echo "init"
            $cacheKeysForPR=$(gh cache list --key ${{ env.CACHE_KEY }} --json key --jq '.[].key')
            echo $cacheKeysForPR
            foreach ($cacheKey in $cacheKeysForPR) {
                if ($cacheKey -ceq "${{ env.CACHE_KEY }}")  {
                  echo "hint cache $cacheKey"
                  gh cache delete $cacheKey
                  echo "delete cache $cacheKey done"
                }
             }
            echo "Done"
          }
          clearn_caches
        env:
          GH_TOKEN: ${{ secrets.NEXTCLOUD_BRANCH_ACCESS_TOKEN }}
          CACHE_KEY: ${{ runner.os }}-build-${{ hashFiles(env.CRAFT_MASTER_CONFIG) }}

      - name: Discover cached Craft directories
        id: windows-cache-craft-restore
        if: inputs.rebuild_cache == false || steps.windows-cache-check.outputs.env-cache-hit == true 
        uses: actions/cache/restore@v5 # v5
        with:
          path: |
            ${{ env.CHOCO_LOCATION }}
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-cache-${{ hashFiles(env.CRAFT_MASTER_CONFIG) }}

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: inputs.rebuild_cache == true ||( steps.windows-cache-check.outputs.env-cache-hit == true && steps.windows-cache-check.outputs.build-cache-hit != true) 
        with:
          python-version: '3.12'

      - name: Install choco
        if: inputs.rebuild_cache == true ||( steps.windows-cache-check.outputs.env-cache-hit == true && steps.windows-cache-check.outputs.build-cache-hit != true) 
        shell: pwsh
        run: |
          choco source add -n=chocoOfflineControl -s="file:///${{ env.CHOCO_LOCATION }}/" --priority=5
          choco install -f inkscape png2imagemagickico --cache-location="${{ env.CHOCO_LOCATION }}/" 

      - name: Compile
        if: inputs.rebuild_cache == true ||( steps.windows-cache-check.outputs.env-cache-hit == true && steps.windows-cache-check.outputs.build-cache-hit != true) 
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          
          craft --options nextcloud-client.srcDir=${{ env.BASE_WORKSPACE }} nextcloud-client

      - name: Save cached Craft directories
        if: inputs.rebuild_cache == true ||( steps.windows-cache-check.outputs.env-cache-hit == true && steps.windows-cache-check.outputs.build-cache-hit != true) 
        id: build-windows-build-craft-save
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.CHOCO_LOCATION }}
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.BASE_WORKSPACE }}/${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-build-${{ hashFiles(env.CRAFT_MASTER_CONFIG) }}

  call-package-workflow:
    needs: build
    uses: ./.github/workflows/windows-package.yml
    with:
      rebuild_cache: ${{ inputs.rebuild_cache }}
    secrets:
      NEXTCLOUD_BRANCH_ACCESS_TOKEN: ${{ secrets.NEXTCLOUD_BRANCH_ACCESS_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

          
